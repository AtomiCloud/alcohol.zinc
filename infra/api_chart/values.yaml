serviceTree:
  landscape: lapras
  platform: alcohol
  service: dotnet
  module: api

replicaCount: 1

aspNetEnv: Development

appSettings:
  App:
    Mode: Server

configMountPath: /app/App/Config

image:
  repository: dotnet-chart
  pullPolicy: IfNotPresent
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: false
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  containerPort: 9000

ingress:
  enabled: false
  className: 'traefik'
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}

autoscaling: {}

# Keep the old pod serving until the new one is ready.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

minReadySeconds: 5

# Covers the preStop sleep plus the .NET host's 30 s shutdown timeout.
terminationGracePeriodSeconds: 60

# Lets the ingress drop the pod from its upstreams before Kestrel gets SIGTERM.
lifecycle:
  preStop:
    exec:
      command: ['sleep', '10']

# Rendered only when replicaCount > 1 or autoscaling is on.
podDisruptionBudget:
  maxUnavailable: 1

startupProbe: {}

readinessProbe: {}

livenessProbe: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: {}
